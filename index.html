<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="nanni-archive">
  <meta name="keywords" content="blog personal, nanni, anime, pink aesthetic, 90s web">
  <meta name="author" content="Nanni">
  <title>nanni-archive</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Silkscreen&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/requests.css">
</head>
<body>
<div class="page">
  <!-- Header -->
  <header class="header">
    <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
    <label for="nav-toggle" class="hamburger" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </label>
    <div class="nav-overlay" onclick="document.getElementById('nav-toggle').checked = false;"></div>
    <nav class="nav">
      <a href="https://nanni-archive.neocities.org/" target="_self">HOME</a>
      <a href="https://nanni-archive.neocities.org/recomendaciones" target="_self">RECOMMENDATIONS</a>
      <a href="https://nanni-archive.neocities.org/blogs" target="_self">BLOGS</a>
      <a href="https://nanni-archive.neocities.org/galeria" target="_self">GALLERY</a>
      <a href="https://nanni-archive.neocities.org/archivo" target="_self">ARCHIVE</a>
      <a href="https://nanni-archive.neocities.org/tutoriales" class="active" target="_self">TUTORIALS</a>
      <a href="https://nanni-archive.neocities.org/redes" target="_self">LINKS</a>
    </nav>
    
    <a href="#mi-footer" target="_self">
      <img src="img/nannibot.gif" alt="Nanni Archive" width="158" height="41" style="image-rendering: pixelated; border: 1px solid #FFD1DC; cursor: pointer;">
    </a>
  </header>

  <section class="requests-hero">
    <h1><span class="pixel-star">✦</span> REQUESTS <span class="pixel-star">✦</span></h1>
    <p class="tagline">Ask for tutorials or ideas for the kawaii website ♡</p>
  </section>

  <div class="requests-layout">

    <div class="cbox-wrapper">

      <div class="nanni-comments">

        <h3>✦ LEAVE YOUR REQUEST ✦</h3>

        <p class="comment-intro">
          Tell me which tutorial you'd like to see next ♡
        </p>

        <input 
          id="comment-name"
          type="text"
          placeholder="Your name ♡">

        <textarea 
          id="comment-message"
          placeholder="Your tutorial idea..."></textarea>

        <button class="comment-send" onclick="sendComment()">
          SEND
        </button>

        <div id="comments-list">
           ✦ loading messages... ✦
        </div>

      </div>

    </div>

    <a href="https://nanni-archive.neocities.org/tutoriales" class="btn-back">BACK TO TUTORIALS</a>

  </div>

</div>

<script>

const API = "https://script.google.com/macros/s/AKfycbwNMCVShoJcYUH36yjeCTfnqJqpp1ZSFUs2nPS0Me_msbwKLRKO5X_p7AIY-SedgQo/exec";
const PAGE = "tutoriales";



function loadComments(){

  const oldScript = document.getElementById("comments-loader");

  if(oldScript){
    oldScript.remove();
  }


  const script = document.createElement("script");

  script.id = "comments-loader";

  script.src =
  API +
  "?page=" +
  PAGE +
  "&callback=showComments";


  document.body.appendChild(script);

}





function escapeHTML(text){

  return text
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}




function showComments(comments){


  const box = document.getElementById("comments-list");


  if(!comments.length){

    box.innerHTML = `
      <p class="empty-comments">
      No requests yet ♡
      </p>
    `;

    return;

  }



  box.innerHTML = "";



  [...comments].reverse().forEach(comment => {



    box.innerHTML += `


    <div class="comment-card">


      <div class="comment-name">

        ${escapeHTML(comment.name)}

      </div>



      <div class="comment-date">

        ${new Date(comment.date).toLocaleDateString()}

      </div>



      <p>

        ${escapeHTML(comment.message)}

      </p>


    </div>


    `;



  });



}






async function sendComment(){



const name =
document.getElementById("comment-name")
.value
.trim();



const message =
document.getElementById("comment-message")
.value
.trim();





if(!name || !message){

alert("Please write your name and message ♡");

return;

}





fetch(API,{

method:"POST",

mode:"no-cors",

body:new URLSearchParams({

page:PAGE,

name:name,

website:"",

message:message

})

});






document.getElementById("comment-name").value="";

document.getElementById("comment-message").value="";





setTimeout(()=>{

loadComments();

},1500);




}





loadComments();



</script>

</body>
</html>
